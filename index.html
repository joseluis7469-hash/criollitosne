
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEISBOL MENOR STATS - Seccional Nueva Esparta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background-attachment: fixed;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            background-image: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), url('https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?q=80&w=2000&auto=format&fit=crop');
            image-rendering: -webkit-optimize-contrast;
            scroll-behavior: smooth;
        }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fade-in 0.3s ease-out forwards;
        }
        
        /* Animación para fila seleccionada */
        @keyframes row-pulse {
            0% { background-color: #dbeafe; }
            50% { background-color: #bfdbfe; }
            100% { background-color: #dbeafe; }
        }
        .animate-row-selected {
            animation: row-pulse 2s infinite ease-in-out;
        }

        main {
            position: relative;
            z-index: 10;
        }
        /* Barras de desplazamiento Estilizadas Premium */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #1e3a8a;
            border-radius: 20px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #ef4444;
        }

        /* Máscara de Desvanecimiento para el final de la tabla */
        .scroll-mask-bottom {
            -webkit-mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
            mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
        }

        /* Aviso de protocolo local */
        #local-warning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #ef4444;
            color: white;
            text-align: center;
            padding: 10px;
            z-index: 9999;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="local-warning">⚠️ ERROR: Debes usar un Servidor Local (Live Server) para que la App funcione. No abras el archivo directamente.</div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
        // Detectar si se abre como archivo local
        if (window.location.protocol === 'file:') {
            document.getElementById('local-warning').style.display = 'block';
        }
    </script>
</body>
</html>
